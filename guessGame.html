  <meta charset="UTF-8">

  <title>Number Guessing Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      text-align: center;
    }
    .hidden {
      display: none;
    }
    .message {
      margin: 15px 0;
      font-size: 18px;
      color: #333;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
  </style>

<body>
    <h1>
        Number guessing game
    </h1>
    <p class="message" id="message"> Guess a number between 1 and 100:</p>
    <input type="number" id="userGuess" placeholder="Enter a number"/>
    <button onclick="submitGuess()">Submit Guess</button>
    <p class="message" id="attemptsLeft"><</p>
    <button onclick="playAgain" class="hidden" id="playAgainBtn">Play again?</button>
</body>

<script>
    //sk: Write a program where:

    //The computer picks a random number between 1 and 100.
    //The user inputs a guess.
    //The program tells the user if the guess is too high, too low, or correct.
    //The game continues until the user guesses the correct number.

  const maxAttempts = 10;
  let randomNumber;
  let attempts;

  const messageEl = document.getElementById("message");
  const attemptsLeftEl = document.getElementById("attemptsLeft");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const userGuessInput = document.getElementById("userGuess");

  function initGame () {
    randomNumber = Math.floor(Math.random() * 100) +1;
    attempts = 0;
    messageEl.textContent = "Guess a number between 1 and 100:";
    attemptsLeftEl.textContent = `You have ${maxAttempts} guess left.`;
    userGuessInput.value = "";
    userGuessInput.disabled = false;
    playAgainBtn.classList.add("hidden");
  }

  function submitGuess() {
    const userGuess = parseInt(userGuessInput.value, 10);

    if (isNaN(userGuess)) {
      messageEl.textContent = "Please enter a valid number";
      return;
    }

    attempts++;
    const guessesLeft = maxAttempts - attempts;

    if (userGuess < randomNumber) {
      messageEl.textContent = "Too low!";
    } else if (userGuess > randomNumber) {
      messageEl.textContent = "Too high!";
    } else if (attempts >= 10) {
      messageEl.textContent = "You lose!"; 
    } else {
      alert(`Congratz! You guessed after ${attempts} attempts!`);
      endGame();
      return;
    }

    if (guessesLeft <=0 ) {
      messageEl.textContent = `Game over! You failed to find number: ${randomNumber}`;
      endGame();
    } else {
      attemptsLeftEl.textContent = `You have ${guessesLeft} guesses left.`;
    }
  }
  function endGame() {
    userGuessInput.disabled = true;
    playAgainBtn.classList.remove("hidden");
  }

  function playAgain() {
    initGame();
  }

  initGame()
